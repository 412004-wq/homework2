<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>背單字卡</title>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'oil-sky': '#8ab5f6',
            'oil-amber': '#f6c77c',
            'oil-rose': '#f2a8c9',
            'oil-butter': '#fff1c8',
            'oil-slate': '#203154',
            'oil-olive': '#7c8f58'
          },
          boxShadow: {
            oil: '0 28px 60px rgba(32,49,84,0.18)'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-oil-butter via-oil-rose to-oil-sky text-oil-slate">
  <main class="mx-auto max-w-5xl px-6 py-10">
    <section class="mb-8 flex flex-col gap-4 rounded-[2rem] border border-oil-slate/10 bg-white/80 p-8 shadow-oil backdrop-blur-xl">
      <div>
        <h1 class="text-4xl font-extrabold tracking-tight">背單字卡</h1>
        <p class="mt-3 text-base leading-7 text-slate-700">點選卡片翻面，查看翻譯、詞性、例句與字根分析。</p>
      </div>
      <div class="inline-flex items-center justify-between rounded-full bg-oil-sky/10 px-5 py-3 text-sm font-semibold text-oil-slate shadow-sm sm:w-auto">
        <span>目前卡片</span>
        <span id="card-counter" class="ml-3 rounded-full bg-oil-amber/20 px-3 py-1 text-oil-slate">0 / 0</span>
      </div>
    </section>

    <section class="mb-10 flex flex-wrap items-center justify-center gap-4">
      <button id="prev" class="rounded-full border border-oil-slate/20 bg-white/90 px-5 py-3 text-sm font-semibold text-oil-slate shadow-lg shadow-oil/10 transition hover:-translate-y-0.5">上一個</button>
      <button id="manage" class="rounded-full border border-oil-slate/20 bg-oil-amber text-slate-950 px-5 py-3 text-sm font-semibold shadow-lg shadow-oil/10 transition hover:-translate-y-0.5">管理單字</button>
      <button id="next" class="rounded-full border border-oil-slate/20 bg-white/90 px-5 py-3 text-sm font-semibold text-oil-slate shadow-lg shadow-oil/10 transition hover:-translate-y-0.5">下一個</button>
    </section>

    <div class="card-wrapper mx-auto w-[380px] max-w-full" style="perspective:1200px;">
      <div class="card relative h-[250px] w-full" id="card">
        <div class="face front flex items-center justify-center rounded-[28px] border border-oil-slate/10 bg-gradient-to-br from-oil-butter via-white to-oil-rose text-5xl font-extrabold text-oil-slate shadow-xl shadow-oil/15" id="card-front">Loading...</div>
        <div class="face back rounded-[28px] border border-oil-slate/10 bg-white/95 p-6 text-sm text-slate-900 shadow-xl shadow-oil/15" id="card-back"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
